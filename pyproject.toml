[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "divergent-mcp"
version = "0.1.0"
description = "Divergent ideation over OpenRouter: parallel multi-model, multi-lens brainstorming with dedup and novelty/utility selection. CLI + stdio MCP server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.1,<4",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/garland3/divergent-mcp"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
]

[project.scripts]
divergent = "divergent_mcp.cli:main"
divergent-mcp = "divergent_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/divergent_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real OpenRouter API (needs OPENROUTER_API_KEY and DIVERGENT_LIVE=1)"]

[tool.ruff]
line-length = 100
